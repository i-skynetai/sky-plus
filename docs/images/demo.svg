    <text y="156"><tspan x="36">decision</tspan><tspan x="160" fill="#4ec9b0">OK</tspan><tspan x="260">fake@1.0.0</tspan><tspan x="420">no health check implemented</tspan></text>
    <text y="174"><tspan x="36">guardrail</tspan><tspan x="160" fill="#4ec9b0">OK</tspan><tspan x="260">fake@1.0.0</tspan><tspan x="420">no health check implemented</tspan></text>
