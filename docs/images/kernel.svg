<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">How the kernel turns a config file into a running stack</text>

  <g font-size="13">
    <rect x="20" y="70" width="170" height="70" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
    <text x="105" y="94" text-anchor="middle" font-weight="bold" fill="#222">skynet.yaml</text>
    <text x="105" y="114" text-anchor="middle" fill="#444">profile + overrides</text>
    <text x="105" y="130" text-anchor="middle" fill="#444">+ requirements</text>

    <rect x="222" y="70" width="170" height="70" rx="6" fill="#dbe8fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="307" y="94" text-anchor="middle" font-weight="bold" fill="#222">registry</text>
    <text x="307" y="114" text-anchor="middle" fill="#444">built-in adapters that</text>
    <text x="307" y="130" text-anchor="middle" fill="#444">load + entry-point plug-ins</text>

    <rect x="424" y="70" width="170" height="70" rx="6" fill="#dbe8fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="509" y="94" text-anchor="middle" font-weight="bold" fill="#222">resolver</text>
    <text x="509" y="114" text-anchor="middle" fill="#444">manifest vs requirements,</text>
    <text x="509" y="130" text-anchor="middle" fill="#444">version range, dependencies</text>

    <rect x="626" y="70" width="170" height="70" rx="6" fill="#d9f2e0" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="711" y="94" text-anchor="middle" font-weight="bold" fill="#222">start</text>
    <text x="711" y="114" text-anchor="middle" fill="#444">initialise in order,</text>
    <text x="711" y="130" text-anchor="middle" fill="#444">health-check each</text>

    <rect x="828" y="70" width="112" height="70" rx="6" fill="#d9f2e0" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="884" y="94" text-anchor="middle" font-weight="bold" fill="#222">services</text>
    <text x="884" y="114" text-anchor="middle" fill="#444">model, memory,</text>
    <text x="884" y="130" text-anchor="middle" fill="#444">guardrail, …</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <line x1="190" y1="105" x2="220" y2="105"/><line x1="392" y1="105" x2="422" y2="105"/>
    <line x1="594" y1="105" x2="624" y2="105"/><line x1="796" y1="105" x2="826" y2="105"/>
  </g>

  <!-- refusal branch -->
  <path d="M 509 140 L 509 190" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="330" y="192" width="358" height="76" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="509" y="214" text-anchor="middle" font-weight="bold" fill="#222">refused before anything starts</text>
  <text x="509" y="234" text-anchor="middle" fill="#444" font-size="13">a missing provider, a wrong version, or a feature</text>
  <text x="509" y="252" text-anchor="middle" fill="#444" font-size="13">the agent needs that the provider does not declare</text>

  <!-- doctor -->
  <rect x="20" y="192" width="280" height="60" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.5"/>
  <text x="160" y="214" text-anchor="middle" font-weight="bold" fill="#222">skynet doctor</text>
  <text x="160" y="234" text-anchor="middle" fill="#444" font-size="13">the same path, reported as a table, never raises</text>

  <rect x="20" y="284" width="920" height="54" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.2"/>
  <text x="480" y="306" text-anchor="middle" font-weight="bold" fill="#222">A manifest is a promise</text>
  <text x="480" y="326" text-anchor="middle" fill="#444" font-size="13">each provider declares the features it implements; the conformance checks exercise every declared feature; a swap that would lose one is refused</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
</svg>
