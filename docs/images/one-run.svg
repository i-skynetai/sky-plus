<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">One run: the model proposes, the rules decide, the runtime executes, the record remembers</text>

  <g font-size="13">
    <rect x="20" y="70" width="130" height="64" rx="6" fill="#dbe8fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="85" y="94" text-anchor="middle" font-weight="bold" fill="#222">guard input</text>
    <text x="85" y="114" text-anchor="middle" fill="#444">rules check the task</text>

    <rect x="178" y="70" width="130" height="64" rx="6" fill="#dbe8fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="243" y="94" text-anchor="middle" font-weight="bold" fill="#222">recall</text>
    <text x="243" y="114" text-anchor="middle" fill="#444">memory for context</text>

    <rect x="336" y="70" width="130" height="64" rx="6" fill="#d9f2e0" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="401" y="94" text-anchor="middle" font-weight="bold" fill="#222">plan</text>
    <text x="401" y="114" text-anchor="middle" fill="#444">model proposes</text>

    <rect x="494" y="70" width="130" height="64" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
    <text x="559" y="94" text-anchor="middle" font-weight="bold" fill="#222">govern</text>
    <text x="559" y="114" text-anchor="middle" fill="#444">rules + authorization</text>

    <rect x="652" y="70" width="130" height="64" rx="6" fill="#dbe8fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="717" y="94" text-anchor="middle" font-weight="bold" fill="#222">act</text>
    <text x="717" y="114" text-anchor="middle" fill="#444">run the tool</text>

    <rect x="810" y="70" width="130" height="64" rx="6" fill="#dbe8fb" stroke="#2f6fd6" stroke-width="1.5"/>
    <text x="875" y="94" text-anchor="middle" font-weight="bold" fill="#222">finish</text>
    <text x="875" y="114" text-anchor="middle" fill="#444">guard, remember</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <line x1="150" y1="102" x2="176" y2="102"/><line x1="308" y1="102" x2="334" y2="102"/><line x1="466" y1="102" x2="492" y2="102"/>
    <line x1="624" y1="102" x2="650" y2="102"/>
  </g>
  <!-- plan -> finish when final -->
  <path d="M 401 134 L 401 160 L 875 160 L 875 136" fill="none" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="640" y="154" text-anchor="middle" fill="#2e8b57" font-size="12">final answer</text>
  <!-- act -> plan loop -->
  <path d="M 717 134 L 717 186 L 401 186 L 401 136" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="559" y="200" text-anchor="middle" fill="#555" font-size="12">tool result goes back to the model, up to max_turns</text>
  <!-- govern -> end -->
  <path d="M 559 134 L 559 230" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="559" y="252" text-anchor="middle" fill="#c0392b" font-size="12">denied, or needs a human: the run stops here with that status</text>

  <rect x="20" y="290" width="920" height="56" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.2"/>
  <text x="480" y="312" text-anchor="middle" font-weight="bold" fill="#222">Underneath every step</text>
  <text x="480" y="332" text-anchor="middle" fill="#444" font-size="13">each provider call is one span in the trace · each step is one line in the hash-chained run record · a failing memory is recorded, never fatal</text>
  <text x="480" y="378" text-anchor="middle" fill="#666" font-size="13">The same six steps run on the fake runtime and on LangGraph; the application never sees the graph.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e8b57"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
  </defs>
</svg>
