[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-plus"
version = "1.0.0"
description = "Build agents, not agent infrastructure. A lite, provider-pluggable SDK: you write the agent, configuration picks the runtime, model, memory, decision, guardrails, evaluation and telemetry underneath."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
litellm = ["litellm>=1.40"]
mem0 = ["mem0ai>=0.1"]
praxis = ["praxis"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
deepeval = ["deepeval>=1.0"]
development = ["langgraph>=0.2", "litellm>=1.40", "mem0ai>=0.1", "opentelemetry-api>=1.25",
               "opentelemetry-sdk>=1.25", "deepeval>=1.0"]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
skynet = "skynet_plus.cli:main"

[tool.setuptools.packages.find]
include = ["skynet_plus*"]

